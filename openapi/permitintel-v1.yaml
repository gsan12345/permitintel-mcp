info:
  title: PermitIntel API
  version: "1.0.0"
  summary: Building permit records and Florida contractor license data.
  description: |
    Building permit records collected from the cities and counties that issue them, served as JSON.

    On 2026-11-08: 106,253,273 permit records across all 50 states, in 2,682
    published jurisdictions. These figures move with every nightly load; the live numbers are at
    `GET /v1/coverage` (no key needed, costs 0 records). Contractor license verification reads the
    Florida DBPR record.

    ## Reading a response

    There is no `success`/`data` wrapper and there is no `total`. Each endpoint returns its payload
    under a named key (`permits`, `contractors`, `jurisdictions`) next to a `query` echo of the
    parameters it actually applied, a `count` of rows in this page, and a `disclosure` string.
    Read the `query` echo back when you are not sure a filter landed.

    `total` is absent on purpose: counting all matches costs the same scan the page was bounded to
    avoid, so the API does not quote a number it cannot compute honestly.

    ## Counts are a floor

    Permit offices publish on their own schedules and some publish almost nothing. `disclosure` is
    on every permit response and is not boilerplate to strip. Present results as "at least N on
    record", never as a total filed.

    ## Metering

    Per record, where one record is one object returned. Writes, empty results, errors, the public
    coverage endpoints and `/v1/usage` cost nothing. `X-Records-Request`, `X-Records-Limit`,
    `X-Records-Remaining` and `X-Records-Reset` ride every metered response. At the monthly ceiling
    the API returns `402 records_limit_exceeded` with an upgrade link. There is no sandbox: evaluate
    on the 14-day trial key against production.

    ## Unknown parameters are refused

    A query parameter an endpoint does not accept returns `400 unknown_param`. Nothing is silently
    ignored, so a typo fails loudly instead of returning a plausible wrong answer.
